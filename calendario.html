const db=firebase.database(),calRef=db.ref('nekton/calendario'),playersRef=db.ref('nekton/giocatori'),convRef=db.ref('nekton/convocati'),GROUPS=[{key:'acquagol',label:'🌊 Acquagol'},{key:'u12u13',label:'🏊 U12 U13'},{key:'u14u15u16',label:'🏊 U14 U15 U16'},{key:'u16',label:'🏊 U16'},{key:'senior',label:'🤽 Senior'}];let allData={},allPlayers={},allConv={},activeFilter='tutti',editingId=null;const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),admin=()=>sessionStorage.getItem('nektonManager')==='1';function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function roles(p){let r=[];if(p.capitano)r.push('C');if(p.portiere)r.push('P');return r.length?`<span class="conv-role-badge">${r.join('')}</span>`:''}function playerMap(){const m={};GROUPS.forEach(g=>Object.entries(allPlayers[g.key]||{}).forEach(([id,p])=>m[id]={...p,gruppo:g.key}));return m}

function render(){const open=new Set([...document.querySelectorAll('.conv-section.open')].map(x=>x.id.replace('conv-',''))),c=$('calendario-container'),today=new Date().toISOString().slice(0,10),entries=Object.entries(allData).filter(([,p])=>activeFilter==='tutti'||p.campionato===activeFilter).sort((a,b)=>(a[1].data||'').localeCompare(b[1].data||''));if(!entries.length){c.innerHTML='<div class="no-items">Nessuna partita in programma. 💤</div>';return}const pm=playerMap();c.innerHTML=entries.map(([id,p])=>{const festa=p.campionato==='Festa',d=new Date((p.data||'')+'T12:00:00'),date=isNaN(d)?p.data:d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}),mapUrl=p.citta||p.indirizzo?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([p.citta,p.indirizzo].filter(Boolean).join(', ')):'';return `<div class="partita-card ${p.data<today?'passata':''}"><div class="partita-top"><span class="campionato-badge">${esc(p.campionato)}</span><span class="partita-data">📅 ${esc(date)}${p.ora?' – '+esc(p.ora):''}${admin()?` <button class="partita-edit-btn" data-id="${id}">✏️</button><button class="partita-del-btn" data-id="${id}">🗑️</button>`:''}</span></div>${festa?`<div class="partita-avversario">🎉 ${esc(p.nomeEvento||'Festa')}</div>`:`<div class="partita-avversario">vs ${esc(p.avversario)}</div><div class="partita-info"><span class="partita-luogo ${p.luogo==='casa'?'casa':'trasferta'}">${p.luogo==='casa'?'🏠 Casa':'✈️ Trasferta'}</span>${p.risultato?`<span class="partita-risultato">🏆 ${esc(p.risultato)}</span>`:''}</div>${mapUrl?`<div class="partita-trasferta-info">📍 <a href="${mapUrl}" target="_blank" rel="noopener noreferrer">${esc([p.citta,p.indirizzo].filter(Boolean).join(' · '))} ↗</a></div>`:''}`}${p.note?`<div class="partita-note"><strong>📝 Note:</strong> ${esc(p.note)}</div>`:''}<button class="conv-toggle-btn" data-id="${id}">🤽 Convocati${Object.keys(allConv[id]||{}).length?' ('+Object.keys(allConv[id]).length+')':''}</button><div class="conv-section" id="conv-${id}"></div></div>`}).join('');$$('.partita-del-btn').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa partita?'))calRef.child(b.dataset.id).remove()});$$('.partita-edit-btn').forEach(b=>b.onclick=()=>edit(b.dataset.id));$$('.conv-toggle-btn').forEach(b=>b.onclick=()=>{const s=$('conv-'+b.dataset.id);s.classList.toggle('open');if(s.classList.contains('open'))renderConv(b.dataset.id,s,pm)});open.forEach(id=>{const s=$('conv-'+id);if(s){s.classList.add('open');renderConv(id,s,pm)}})}
function renderConv(id,section,pm){const selected=allConv[id]||{};section.innerHTML='<div class="conv-label">🤽 Convocati</div>';const list=document.createElement('div');list.className='conv-list';Object.keys(selected).map(k=>pm[k]?{id:k,...pm[k]}:null).filter(Boolean).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).forEach(p=>{const x=document.createElement('div');x.className='conv-chip';x.innerHTML=`${esc(p.nome)}${roles(p)}${admin()?`<button class="conv-chip-remove" data-id="${p.id}">✕</button>`:''}`;list.appendChild(x)});if(!list.children.length)list.innerHTML='<span class="conv-empty">Nessun convocato selezionato.</span>';section.appendChild(list);if(!admin())return;section.insertAdjacentHTML('beforeend','<hr class="conv-divider"><div class="conv-label">Seleziona categoria e giocatori</div>');const filters=document.createElement('div');filters.className='conv-filter-row';const area=document.createElement('div');area.className='conv-list';let active='tutti';[{key:'tutti',label:'Tutte le categorie'},...GROUPS].forEach(g=>{const b=document.createElement('button');b.className='conv-filter-btn'+(g.key==='tutti'?' active':'');b.textContent=g.label;b.dataset.group=g.key;filters.appendChild(b)});section.appendChild(filters);section.appendChild(area);function draw(){area.innerHTML='';Object.entries(pm).filter(([,p])=>active==='tutti'||p.gruppo===active).sort((a,b)=>(a[1].nome||'').localeCompare(b[1].nome||'')).forEach(([pid,p])=>{const b=document.createElement('button');b.type='button';b.className='conv-player-btn'+(selected[pid]?' convocato':'');b.innerHTML=`<span>${esc(p.nome)}</span>${roles(p)}`;b.dataset.id=pid;area.appendChild(b)})}draw();filters.onclick=e=>{const b=e.target.closest('button');if(!b)return;active=b.dataset.group;filters.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};area.onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=convRef.child(id).child(b.dataset.id);selected[b.datase function edit(id){const p=allData[id];editingId=id;['data','ora','avversario','risultato','citta','indirizzo','note','nome-evento','descrizione'].forEach(k=>{const e=$('f-'+k);if(e)e.value=p[k]||''});$('f-campionato').value=p.campionato||'Habawaba';$('f-luogo').value=p.luogo||'casa';toggle();$('manager-panel').classList.add('visible');$('panel-title').textContent='✏️ Modifica partita';$('add-btn').textContent='💾 Salva modifiche';$('cancel-edit-btn').style.display='block'}function toggle(){const f=$('f-campionato').value==='Festa';$('partita-fields').style.display=f?'none':'block';$('festa-fields').style.display=f?'block':'none';$('trasferta-fields').style.display=$('f-luogo').value==='trasferta'?'block':'none'}function reset(){editingId=null;$$('.form-input').forEach(e=>e.value='');$('f-campionato').value='Habawaba';$('f-luogo').value='casa';toggle();$('panel-title').textContent='➕ Aggiungi Partita';$('add-btn').textContent='➕ Aggiungi partita';$('cancel-edit-btn').style.display='none'}
$('add-btn').onclick=()=>{const festa=$('f-campionato').value==='Festa',e={data:$('f-data').value,ora:$('f-ora').value,campionato:$('f-campionato').value,note:$('f-note').value.trim()};if(!e.data||(!festa&&!$('f-avversario').value.trim()))return toast('⚠️ Compila data e avversario!');if(festa){e.nomeEvento=$('f-nome-evento').value.trim()||'Festa';e.descrizione=$('f-descrizione').value.trim()}else{e.avversario=$('f-avversario').value.trim();e.luogo=$('f-luogo').value;e.risultato=$('f-risultato').value.trim();if(e.luogo==='trasferta'){e.citta=$('f-citta').value.trim();e.indirizzo=$('f-indirizzo').value.trim()}}(editingId?calRef.child(editingId).update(e):calRef.push(e)).then(()=>{reset();toast('✅ Salvato!')}).catch(()=>toast('❌ Errore'))};$('cancel-edit-btn').onclick=reset;$('f-campionato').onchange=toggle;$('f-luogo').onchange=toggle;$$('.filter-btn').forEach(b=>b.onclick=()=>{$$('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});const overlay=$('modal-overlay');$('pin-btn').onclick=()=>{if(admin()){sessionStorage.setItem('nektonManager','0');$('manager-panel').classList.remove('visible');$('pin-btn').textContent='🔒';render()}else{overlay.classList.add('open');$('pin-input').focus()}};$('modal-cancel').onclick=()=>overlay.classList.remove('open');$('modal-confirm').onclick=()=>{if($('pin-input').value==='nekton2026'){sessionStorage.setItem('nektonManager','1');overlay.classList.remove('open');$('manager-panel').classList.add('visible');$('pin-btn').textContent='🔐';render()}else $('modal-error').textContent='❌ PIN non corretto'};if(admin()){$('manager-panel').classList.add('visible');$('pin-btn').textContent='🔐'}
