<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="nekton-img.jpg" type="image/jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📆 Calendario Partite · Nekton</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;overflow-x:hidden}body{font-family:'Segoe UI',sans-serif;background:#e8f4fd;min-height:100vh;color:#1a3a5c}
    .header{background:linear-gradient(160deg,#012AFE 0%,#0055cc 40%,#00b4d8 100%);color:#fff;padding:36px 20px 24px;text-align:center;position:relative}.back-link,.pin-btn{position:absolute;top:14px;background:#ffffff40;color:#fff;border:0;z-index:2;cursor:pointer}.back-link{left:14px;border-radius:20px;padding:7px 15px;font-size:.76rem;font-weight:700;text-decoration:none}.pin-btn{right:14px;border-radius:50%;width:40px;height:40px;font-size:1.3rem}.icons{font-size:3rem;display:block;margin-bottom:10px}.header h1{font-size:1.6rem}.subtitle{font-size:.82rem;opacity:.9;margin-top:6px}.sync-status{display:flex;justify-content:center;align-items:center;gap:6px;font-size:.7rem;margin-top:10px}.sync-dot{width:8px;height:8px;border-radius:50%;background:#fff}.sync-dot.connected{background:#69f0ae}.sync-dot.error{background:#ff5252}.wave-divider{line-height:0;background:linear-gradient(160deg,#012AFE,#0055cc 40%,#00b4d8)}.wave-divider svg{display:block;width:100%}.container{max-width:540px;margin:auto;padding:16px 12px 64px}
    .filter-row{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}.filter-btn{background:#fff;border:2px solid #b3d9f7;border-radius:20px;padding:7px 14px;font-size:.74rem;font-weight:700;color:#006994;cursor:pointer;white-space:nowrap}.filter-btn.active,.filter-btn:hover{background:linear-gradient(135deg,#006994,#00b4d8);color:#fff;border-color:transparent}
    .partita-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #00699412;border:2px solid #ddeeff;border-left:5px solid #006994;position:relative}.partita-card.passata{opacity:.65;border-left-color:#b0bec5;background:#f9fafb}.partita-card.festa{border-left-color:#f06292;border-color:#fce4ec}.partita-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.campionato-badge{font-size:.62rem;font-weight:800;padding:3px 10px;border-radius:10px;background:#e3f2fd;color:#006994;border:1.5px solid #b3d9f7}.partita-date-row{display:flex;align-items:center;gap:4px}.partita-data{font-size:.72rem;font-weight:700;color:#90a4ae}.partita-avversario{font-size:.98rem;font-weight:800;margin-bottom:5px}.partita-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.partita-luogo,.partita-risultato{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:8px}.casa{background:#e0f7fa;color:#006994}.trasferta{background:#fff3e0;color:#e65100}.partita-risultato{color:#006994;background:#e3f2fd}.partita-descrizione,.partita-note,.partita-trasferta-info{font-size:.82rem;color:#607d8b;margin-top:8px;line-height:1.55}.partita-note{background:#fff8e1;border-left:3px solid #ffb300;border-radius:5px;padding:6px 9px;white-space:pre-wrap}.partita-note strong{color:#f57f17}.partita-admin-btns{display:flex;gap:4px}.partita-del-btn,.partita-edit-btn{background:none;border:0;color:#b3d9f7;cursor:pointer;font-size:.9rem;padding:2px}.partita-del-btn:hover{color:#e53935}.partita-edit-btn:hover{color:#ffb300}.section-title{font-size:.78rem;font-weight:800;color:#006994;text-transform:uppercase;letter-spacing:1px;margin:20px 0 14px 2px}.no-items{text-align:center;font-size:.88rem;color:#90a4ae;font-style:italic;padding:30px 10px;background:#fff;border-radius:16px;border:2px dashed #ddeeff}
    .manager-panel{display:none;background:#fff8e1;border-radius:18px;padding:18px;margin-bottom:18px;border:2px solid #ffe082}.manager-panel.visible{display:block}.manager-panel h3{font-size:.76rem;color:#f57f17;text-transform:uppercase;letter-spacing:.9px;margin-bottom:12px}.form-row{display:flex;gap:8px;flex-wrap:wrap}.form-group{margin-bottom:8px;flex:1}.form-group label{font-size:.75rem;font-weight:700;color:#555;display:block;margin-bottom:4px}.form-input{width:100%;border:1.5px solid #ffe082;border-radius:10px;padding:9px 12px;font-size:.86rem;font-family:inherit;color:#333;outline:0;background:#fff}.form-input:focus{border-color:#ffb300}textarea.form-input{resize:vertical;min-height:58px}.pub-btn,.cancel-edit-btn{flex:1;border:0;border-radius:10px;padding:11px;font-size:.86rem;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit}.pub-btn{background:linear-gradient(135deg,#006994,#00b4d8);color:#fff}.cancel-edit-btn{display:none;background:#eceff1;color:#607d8b}.pub-btn-row{display:flex;gap:8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#006994;color:#fff;padding:10px 22px;border-radius:24px;font-size:.83rem;font-weight:600;transition:transform .3s;z-index:999;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0)}.page-footer{text-align:center;font-size:.7rem;color:#aabbc8;padding:20px 0}
    .modal-overlay{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center}.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:20px;padding:28px 24px;max-width:300px;width:90%;text-align:center}.modal h3{font-size:1rem;color:#006994;margin-bottom:8px}.modal p{font-size:.78rem;color:#607d8b;margin-bottom:16px}.modal input{width:100%;border:2px solid #b3d9f7;border-radius:10px;padding:11px;font-size:1rem;text-align:center;letter-spacing:2px}.modal-btns{display:flex;gap:10px;margin-top:14px}.modal-btn{flex:1;padding:11px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.modal-btn.primary{background:#006994;color:#fff}.modal-btn.secondary{background:#eceff1;color:#607d8b}.modal-error{font-size:.75rem;color:#e53935;margin-top:8px}
  </style>
</head>
<body>
  <div class="header"><a class="back-link" href="index.html">&#8592; Home</a><button class="pin-btn" id="pin-btn">🔒</button><span class="icons">📆</span><h1>Calendario Partite</h1><div class="subtitle">Tutti i campionati Nekton</div><div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Connessione in corso…</span></div></div>
  <div class="wave-divider"><svg viewBox="0 0 1440 72" preserveAspectRatio="none"><path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#e8f4fd"/></svg></div>
  <div class="container">
    <div class="manager-panel" id="manager-panel"><h3 id="panel-title">➕ Aggiungi Partita</h3>
      <div class="form-row"><div class="form-group"><label>Data</label><input type="date" class="form-input" id="f-data"></div><div class="form-group"><label>Ora</label><input type="time" class="form-input" id="f-ora"></div></div>
      <div class="form-group"><label>Campionato</label><select class="form-input" id="f-campionato"><option>Habawaba</option><option>U12</option><option>U13</option><option>U14</option><option>U15</option><option>U16</option><option>U17</option><option>U18</option><option value="Promozione">Prima Squadra Promozione</option><option value="Festa">Festa</option></select></div>
      <div id="partita-fields"><div class="form-group"><label>Avversario</label><input type="text" class="form-input" id="f-avversario" maxlength="60" placeholder="Nome squadra avversaria…"></div><div class="form-row"><div class="form-group"><label>Casa / Trasferta</label><select class="form-input" id="f-luogo"><option value="casa">🏠 Casa</option><option value="trasferta">✈️ Trasferta</option></select></div><div class="form-group"><label>Risultato (opz.)</label><input type="text" class="form-input" id="f-risultato" maxlength="10" placeholder="es. 5-3"></div></div><div id="trasferta-fields" style="display:none"><div class="form-group"><label>Città (trasferta)</label><input type="text" class="form-input" id="f-citta" maxlength="60" placeholder="es. Roma"></div><div class="form-group"><label>Indirizzo piscina</label><input type="text" class="form-input" id="f-indirizzo" maxlength="100" placeholder="es. Via Roma 1"></div></div></div>
      <div id="festa-fields" style="display:none"><div class="form-group"><label>Nome evento</label><input type="text" class="form-input" id="f-nome-evento" maxlength="60"></div><div class="form-group"><label>Descrizione (opz.)</label><input type="text" class="form-input" id="f-descrizione" maxlength="120"></div></div>
      <div class="form-group"><label for="f-note">Note (opz.)</label><textarea class="form-input" id="f-note" maxlength="500" placeholder="Aggiungi eventuali informazioni sulla partita…"></textarea></div>
      <div class="pub-btn-row"><button class="pub-btn" id="add-btn">➕ Aggiungi partita</button><button class="cancel-edit-btn" id="cancel-edit-btn">✕ Annulla modifica</button></div>
    </div>
    <div class="filter-row"><button class="filter-btn active" data-filter="tutti">Tutti</button><button class="filter-btn" data-filter="Habawaba">Habawaba</button><button class="filter-btn" data-filter="U12">U12</button><button class="filter-btn" data-filter="U13">U13</button><button class="filter-btn" data-filter="U14">U14</button><button class="filter-btn" data-filter="U15">U15</button><button class="filter-btn" data-filter="U16">U16</button><button class="filter-btn" data-filter="U17">U17</button><button class="filter-btn" data-filter="U18">U18</button><button class="filter-btn" data-filter="Promozione">Promozione</button></div>
    <div class="section-title">🤽 Partite</div><div id="calendario-container"></div>
  </div><div class="page-footer">📆 Calendario · Nekton Pallanuoto</div><div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modal-overlay"><div class="modal"><h3>🔑 Accesso Gestore</h3><p>Inserisci il PIN per gestire il calendario</p><input type="password" id="pin-input" maxlength="20"><div class="modal-error" id="modal-error"></div><div class="modal-btns"><button class="modal-btn secondary" id="modal-cancel">Annulla</button><button class="modal-btn primary" id="modal-confirm">Accedi</button></div></div></div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({apiKey:'AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU',authDomain:'lista-spesa-b9eb1.firebaseapp.com',databaseURL:'https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app',projectId:'lista-spesa-b9eb1',storageBucket:'lista-spesa-b9eb1.firebasestorage.app',messagingSenderId:'468690890938',appId:'1:468690890938:web:048be7f27779d8862d9283'});
    const calRef=firebase.database().ref('nekton/calendario');let allData={},activeFilter='tutti',editingId=null;
    const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const manager=()=>sessionStorage.getItem('nektonManager')==='1';function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
    firebase.database().ref('.info/connected').on('value',s=>{$('sync-dot').className='sync-dot '+(s.val()?'connected':'error');$('sync-label').textContent=s.val()?'✅ Sincronizzato in tempo reale':'❌ Offline – riconnessione…'});
    calRef.on('value',s=>{allData=s.val()||{};render()});
    function render(){const today=new Date().toISOString().slice(0,10),c=$('calendario-container'),entries=Object.entries(allData).filter(([,p])=>activeFilter==='tutti'||p.campionato===activeFilter).sort((a,b)=>(a[1].data||'').localeCompare(b[1].data||''));if(!entries.length){c.innerHTML='<div class="no-items">Nessuna partita in programma. 💤</div>';return}c.innerHTML=entries.map(([id,p])=>{const festa=p.campionato==='Festa',d=new Date((p.data||'')+'T12:00:00'),date=isNaN(d)?p.data:d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});return `<div class="partita-card${p.data<today?' passata':''}${festa?' festa':''}"><div class="partita-top"><span class="campionato-badge">${esc(p.campionato)}</span><div class="partita-date-row"><span class="partita-data">📅 ${esc(date)}${p.ora?' – '+esc(p.ora):''}</span>${manager()?`<div class="partita-admin-btns"><button class="partita-edit-btn" data-id="${id}">✏️</button><button class="partita-del-btn" data-id="${id}">🗑️</button></div>`:''}</div></div>${festa?`<div class="partita-avversario">🎉 ${esc(p.nomeEvento||'Festa')}</div>${p.descrizione?`<div class="partita-descrizione">${esc(p.descrizione)}</div>`:''}`:`<div class="partita-avversario">vs ${esc(p.avversario)}</div><div class="partita-info"><span class="partita-luogo ${p.luogo==='casa'?'casa':'trasferta'}">${p.luogo==='casa'?'🏠 Casa':'✈️ Trasferta'}</span>${p.risultato?`<span class="partita-risultato">🏆 ${esc(p.risultato)}</span>`:''}</div>${p.luogo==='trasferta'&&p.citta?`<div class="partita-trasferta-info">📍 ${esc(p.citta)}${p.indirizzo?' · '+esc(p.indirizzo):''}</div>`:''}`}${p.note?`<div class="partita-note"><strong>📝 Note:</strong> ${esc(p.note)}</div>`:''}</div>`}).join('');if(manager()){$$('.partita-del-btn').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa partita?'))calRef.child(b.dataset.id).remove()});$$('.partita-edit-btn').forEach(b=>b.onclick=()=>edit(b.dataset.id))}}
    const $$=s=>document.querySelectorAll(s);
    function edit(id){const p=allData[id];editingId=id;['data','ora','avversario','risultato','citta','indirizzo','note','nome-evento','descrizione'].forEach(k=>{const el=$('f-'+k);if(el)el.value=p[k.replace('-','')]||''});$('f-campionato').value=p.campionato||'Habawaba';$('f-luogo').value=p.luogo||'casa';toggle();$('panel-title').textContent='✏️ Modifica partita';$('add-btn').textContent='💾 Salva modifiche';$('cancel-edit-btn').style.display='block';$('manager-panel').scrollIntoView({behavior:'smooth'})}
    function toggle(){$('partita-fields').style.display=$('f-campionato').value==='Festa'?'none':'block';$('festa-fields').style.display=$('f-campionato').value==='Festa'?'block':'none';$('trasferta-fields').style.display=$('f-luogo').value==='trasferta'?'block':'none'}
    function reset(){editingId=null;['data','ora','avversario','risultato','citta','indirizzo','note','nome-evento','descrizione'].forEach(k=>{const e=$('f-'+k);if(e)e.value=''});$('f-campionato').value='Habawaba';$('f-luogo').value='casa';toggle();$('panel-title').textContent='➕ Aggiungi Partita';$('add-btn').textContent='➕ Aggiungi partita';$('cancel-edit-btn').style.display='none'}
    $('add-btn').onclick=()=>{const festa=$('f-campionato').value==='Festa',data=$('f-data').value,ora=$('f-ora').value,avversario=$('f-avversario').value.trim();if(!data||(!festa&&!avversario)){toast('⚠️ Compila data e avversario!');return}const e={data,ora,campionato:$('f-campionato').value,note:$('f-note').value.trim()};if(festa){e.nomeEvento=$('f-nome-evento').value.trim()||'Festa';e.descrizione=$('f-descrizione').value.trim()}else{e.avversario=avversario;e.luogo=$('f-luogo').value;e.risultato=$('f-risultato').value.trim();if(e.luogo==='trasferta'){e.citta=$('f-citta').value.trim();e.indirizzo=$('f-indirizzo').value.trim()}}const op=editingId?calRef.child(editingId).update(e):calRef.push(e);op.then(()=>{reset();toast('✅ Salvato!')}).catch(()=>toast('❌ Errore nel salvataggio'))};$('cancel-edit-btn').onclick=reset;$('f-campionato').onchange=toggle;$('f-luogo').onchange=toggle;
    $$('.filter-btn').forEach(b=>b.onclick=()=>{$$('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});
    const overlay=$('modal-overlay');$('pin-btn').onclick=()=>{if(manager()){sessionStorage.setItem('nektonManager','0');$('manager-panel').classList.remove('visible');$('pin-btn').textContent='🔒';render()}else{overlay.classList.add('open');$('pin-input').focus()}};$('modal-cancel').onclick=()=>overlay.classList.remove('open');$('modal-confirm').onclick=()=>{if($('pin-input').value==='nekton2026'){sessionStorage.setItem('nektonManager','1');overlay.classList.remove('open');$('manager-panel').classList.add('visible');$('pin-btn').textContent='🔐';render()}else $('modal-error').textContent='❌ PIN non corretto'};if(manager()){$('manager-panel').classList.add('visible');$('pin-btn').textContent='🔐'}
  </script>
</body>
</html>
