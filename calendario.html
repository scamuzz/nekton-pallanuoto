<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📆 Calendario Partite · Nekton</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #e8f4fd;
      color: #1a3a5c;
    }

    .header {
      background: linear-gradient(160deg, #012AFE, #0055cc 40%, #00b4d8);
      color: #fff;
      padding: 36px 24px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 85, 204, 0.15);
    }

    .header h1 {
      margin: 8px 0;
      font-size: 32px;
      font-weight: 600;
    }

    .header .icons {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 12px;
      opacity: 0.9;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 1;
    }

    .subtitle {
      opacity: 0.9;
      font-size: 13px;
    }

    .pin-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pin-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .wave-divider svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .manager-panel {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .manager-panel h3 {
      margin-top: 0;
      color: #012AFE;
      font-size: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 13px;
      color: #555;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #012AFE;
      box-shadow: 0 0 0 3px rgba(1, 42, 254, 0.1);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    #add-btn {
      background: #012AFE;
      color: #fff;
      flex: 1;
    }

    #add-btn:hover {
      background: #0055cc;
      box-shadow: 0 4px 12px rgba(1, 42, 254, 0.3);
    }

    #cancel-btn {
      background: #f0f0f0;
      color: #666;
    }

    #cancel-btn:hover {
      background: #e0e0e0;
    }

    .sync-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .sync-dot.connected {
      background: #4caf50;
    }

    .sync-dot.error {
      background: #f44336;
    }

    .evento-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border-left: 4px solid #012AFE;
    }

    .evento-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .evento-title {
      font-size: 16px;
      font-weight: 600;
      color: #012AFE;
    }

    .evento-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: #e0e0e0;
    }

    .evento-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .evento-detail {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conv-section {
      margin-top: 12px;
      padding: 12px;
      background: #f5f9ff;
      border-radius: 6px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .conv-section.open {
      max-height: 500px;
    }

    .conv-label {
      font-weight: 600;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }

    .conv-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .conv-player {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #fff;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #e0e0e0;
      transition: all 0.2s;
    }

    .conv-player:hover {
      border-color: #012AFE;
      background: #f0f5ff;
    }

    .conv-player input[type="checkbox"] {
      cursor: pointer;
    }

    .no-events {
      text-align: center;
      padding: 40px 24px;
      color: #999;
    }

    .no-events emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .evento-details {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a class="back-link" href="index.html">← Home</a>
    <button class="pin-btn" id="pin-btn">🔒</button>
    <div class="icons">📆</div>
    <h1>Calendario Partite</h1>
    <div class="subtitle">Gestisci i tuoi eventi sportivi</div>
    <div class="sync-info">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-label">Caricamento...</span>
    </div>
  </div>

  <!-- Wave Divider -->
  <div class="wave-divider">
    <svg viewBox="0 0 1440 72" preserveAspectRatio="none">
      <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#e8f4fd" />
    </svg>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Manager Panel -->
    <div class="manager-panel" id="manager-panel">
      <h3 id="panel-title">➕ Aggiungi Partita</h3>

      <div class="form-row">
        <div class="form-group">
          <label>Data</label>
          <input class="form-input" type="date" id="f-data">
        </div>
        <div class="form-group">
          <label>Ora</label>
          <input class="form-input" type="time" id="f-ora">
        </div>
        <div class="form-group">
          <label>Tipo Evento</label>
          <select id="f-campionato">
            <option value="">-- Scegli --</option>
            <option value="Campionato">Campionato</option>
            <option value="Amichevole">Amichevole</option>
            <option value="Torneo">Torneo</option>
            <option value="Festa">Festa</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Avversario</label>
          <input class="form-input" type="text" id="f-avversario" placeholder="Nome della squadra">
        </div>
        <div class="form-group">
          <label>Risultato</label>
          <input class="form-input" type="text" id="f-risultato" placeholder="Es: 5-2">
        </div>
        <div class="form-group">
          <label>Città</label>
          <input class="form-input" type="text" id="f-citta" placeholder="Luogo della partita">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Indirizzo</label>
          <input class="form-input" type="text" id="f-indirizzo" placeholder="Via, numero civico">
        </div>
        <div class="form-group">
          <label>Nome Evento</label>
          <input class="form-input" type="text" id="f-nome-evento" placeholder="Titolo dell'evento">
        </div>
      </div>

      <div class="form-group">
        <label>Note</label>
        <textarea class="form-input" id="f-note" placeholder="Informazioni aggiuntive..."></textarea>
      </div>

      <div class="form-group">
        <label>Descrizione</label>
        <textarea class="form-input" id="f-descrizione" placeholder="Dettagli dell'evento..."></textarea>
      </div>

      <div class="btn-group">
        <button id="add-btn">Aggiungi</button>
        <button id="cancel-btn" style="display:none;">Annulla</button>
      </div>
    </div>

    <!-- Events Container -->
    <div id="calendario-container"></div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    firebase.initializeApp({
      apiKey: 'AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU',
      authDomain: 'lista-spesa-b9eb1.firebaseapp.com',
      databaseURL: 'https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedb.app',
      projectId: 'lista-spesa-b9eb1',
      storageBucket: 'lista-spesa-b9eb1.appspot.com',
      messagingSenderId: '1080850653945',
      appId: '1:1080850653945:web:0e1d6b4bbf5c3a96cc3aa4'
    });

    // Database References
    const db = firebase.database();
    const calRef = db.ref('nekton/calendario');
    const playersRef = db.ref('nekton/giocatori');
    const convRef = db.ref('nekton/convocati');

    // Groups Configuration
    const GROUPS = [
      { key: 'acquagol', label: '🌊 Acquagol' },
      { key: 'u12u13', label: '🏊 U12/U13' },
      { key: 'u14u15', label: '🏊 U14/U15' },
      { key: 'juniores', label: '🏊 Juniores' },
      { key: 'seniores', label: '🏊 Seniores' }
    ];

    // Helper Functions
    const $ = (id) => document.getElementById(id);
    let allData = {};
    let allPlayers = {};
    let allConv = {};
    let editingId = null;

    // Sync Status
    db.ref('.info/connected').on('value', (s) => {
      $('sync-dot').className = 'sync-dot ' + (s.val() ? 'connected' : 'error');
      $('sync-label').textContent = s.val() ? '✅ Sincronizzato in tempo reale' : '❌ Offline – riprova tra poco';
    });

    // Load Data
    calRef.on('value', (snap) => {
      allData = snap.val() || {};
      render();
    });

    playersRef.on('value', (snap) => {
      allPlayers = snap.val() || {};
      render();
    });

    convRef.on('value', (snap) => {
      allConv = snap.val() || {};
      render();
    });

    // Render Calendar
    function render() {
      const open = new Set([...document.querySelectorAll('.conv-section.open')].map(x => x.id.replace('conv-', '')));
      const c = $('calendario-container');
      const today = new Date().toISOString().slice(0, 10);

      // Sort events by date
      const events = Object.entries(allData)
        .sort(([, a], [, b]) => (a.data || '').localeCompare(b.data || ''));

      if (events.length === 0) {
        c.innerHTML = '<div class="no-events"><emoji>📅</emoji><p>Nessuna partita programmata</p></div>';
        return;
      }

      c.innerHTML = events.map(([id, p]) => `
        <div class="evento-card" data-date="${p.data}">
          <div class="evento-header">
            <div>
              <div class="evento-title">${p.nome_evento || (p.campionato || 'Evento')}</div>
              <div style="font-size: 12px; color: #999; margin-top: 4px;">
                📅 ${p.data || 'TBD'} ${p.ora ? '⏰ ' + p.ora : ''}
              </div>
            </div>
            <div class="evento-actions">
              <button class="icon-btn" onclick="edit('${id}')">✏️</button>
              <button class="icon-btn" onclick="remove('${id}')">🗑️</button>
            </div>
          </div>

          <div class="evento-details">
            ${p.avversario ? `<div class="evento-detail">⚽ ${p.avversario}</div>` : ''}
            ${p.risultato ? `<div class="evento-detail">📊 ${p.risultato}</div>` : ''}
            ${p.citta ? `<div class="evento-detail">📍 ${p.citta}</div>` : ''}
            ${p.indirizzo ? `<div class="evento-detail">🏟️ ${p.indirizzo}</div>` : ''}
          </div>

          ${p.note ? `<div style="font-size: 13px; color: #666; margin-bottom: 8px;">📝 ${p.note}</div>` : ''}

          <div class="conv-section ${open.has(id) ? 'open' : ''}" id="conv-${id}">
            <!-- Convocati renderati qui -->
          </div>
        </div>
      `).join('');

      // Render convocati for each event
      events.forEach(([id]) => {
        const section = $(`conv-${id}`);
        renderConv(id, section, $(`evento-card[data-date="${allData[id].data}"]`));
      });
    }

    // Render Convocati
    function renderConv(id, section, pm) {
      const selected = allConv[id] || {};
      section.innerHTML = '<div class="conv-label">🤽 Convocati</div>';

      const list = document.createElement('div');
      list.className = 'conv-list';

      GROUPS.forEach((group) => {
        const groupPlayers = allPlayers[group.key] || [];
        groupPlayers.forEach((player) => {
          const isSelected = selected[player] || false;
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = isSelected;
          checkbox.onchange = () => {
            const newConv = { ...selected };
            if (checkbox.checked) {
              newConv[player] = true;
            } else {
              delete newConv[player];
            }
            convRef.child(id).set(Object.keys(newConv).length > 0 ? newConv : null);
          };

          const label = document.createElement('label');
          label.className = 'conv-player';
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(player));
          list.appendChild(label);
        });
      });

      section.appendChild(list);

      // Toggle section on click
      section.querySelector('.conv-label').onclick = () => {
        section.classList.toggle('open');
      };
    }

    // Edit Event
    function edit(id) {
      const p = allData[id];
      editingId = id;
      ['data', 'ora', 'avversario', 'risultato', 'citta', 'indirizzo', 'note', 'nome-evento', 'descrizione'].forEach((k) => {
        const e = $('f-' + k);
        if (e) e.value = p[k] || '';
      });
      $('f-campionato').value = p.campionato || '';
      $('panel-title').textContent = '✏️ Modifica Partita';
      $('add-btn').textContent = 'Salva';
      $('cancel-btn').style.display = 'inline-block';
    }

    // Cancel Edit
    $('cancel-btn').onclick = () => {
      editingId = null;
      ['data', 'ora', 'avversario', 'risultato', 'citta', 'indirizzo', 'note', 'nome-evento', 'descrizione', 'campionato'].forEach((k) => {
        const e = $('f-' + k);
        if (e) e.value = '';
      });
      $('panel-title').textContent = '➕ Aggiungi Partita';
      $('add-btn').textContent = 'Aggiungi';
      $('cancel-btn').style.display = 'none';
    };

    // Add/Update Event
    $('add-btn').onclick = () => {
      const festa = $('f-campionato').value === 'Festa';
      const e = {
        data: $('f-data').value,
        ora: $('f-ora').value,
        campionato: $('f-campionato').value,
        note: $('f-note').value.trim()
      };

      if (!e.data || (!festa && !$('f-campionato').value)) {
        alert('Compila almeno Data e Tipo Evento!');
        return;
      }

      if (!festa) {
        e.avversario = $('f-avversario').value.trim();
        e.risultato = $('f-risultato').value.trim();
        e.citta = $('f-citta').value.trim();
        e.indirizzo = $('f-indirizzo').value.trim();
      }

      e.nome_evento = $('f-nome-evento').value.trim();
      e.descrizione = $('f-descrizione').value.trim();

      if (editingId) {
        calRef.child(editingId).update(e);
        editingId = null;
        $('cancel-btn').onclick();
      } else {
        calRef.push(e);
      }

      ['data', 'ora', 'avversario', 'risultato', 'citta', 'indirizzo', 'note', 'nome-evento', 'descrizione', 'campionato'].forEach((k) => {
        const elem = $('f-' + k);
        if (elem) elem.value = '';
      });
    };

    // Remove Event
    function remove(id) {
      if (confirm('Vuoi davvero eliminare questa partita?')) {
        calRef.child(id).remove();
        convRef.child(id).remove();
      }
    }

    // Pin Button
    $('pin-btn').onclick = () => {
      const isPinned = $('manager-panel').style.position === 'fixed';
      if (isPinned) {
        $('manager-panel').style.position = 'relative';
        $('manager-panel').style.top = 'auto';
        $('pin-btn').textContent = '🔒';
      } else {
        $('manager-panel').style.position = 'fixed';
        $('manager-panel').style.top = '90px';
        $('manager-panel').style.zIndex = '100';
        $('pin-btn').textContent = '📌';
      }
    };
  </script>
</body>
</html>
