<script>
  let oneSignalReady = false;
  let oneSignalInstance = null;

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  window.OneSignalDeferred.push(async function (OneSignal) {
    oneSignalInstance = OneSignal;

    await OneSignal.init({
      appId: "95c7aa7c-69a1-4b0e-ac93-ea45a595d0c0",
      serviceWorkerPath: "/OneSignalSDKWorker.js",
      serviceWorkerParam: {
        scope: "/"
      },
      notifyButton: {
        enable: false
      }
    });

    oneSignalReady = true;

    console.log("[OneSignal] init completato");

    OneSignal.User.PushSubscription.addEventListener(
      "change",
      function () {
        console.log("[OneSignal] subscription change");
        refreshNotifyUI();
      }
    );

    refreshNotifyUI();
  });

  function refreshNotifyUI() {
    const banner = document.getElementById("notifyBanner");
    const button = document.getElementById("notify-btn");
    const description = document.querySelector(
      "#notifyBanner .notify-content p"
    );

    if (!banner || !button || !oneSignalReady) {
      return;
    }

    if (
      !("Notification" in window) ||
      !("serviceWorker" in navigator)
    ) {
      banner.classList.add("hidden");
      return;
    }

    const browserPermission = Notification.permission;
    const optedIn =
      oneSignalInstance.User.PushSubscription.optedIn;
    const subscriptionId =
      oneSignalInstance.User.PushSubscription.id;

    console.log("[OneSignal] stato:", {
      browserPermission,
      oneSignalPermission:
        oneSignalInstance.Notifications.permission,
      optedIn,
      subscriptionId
    });

    if (browserPermission === "granted" && optedIn && subscriptionId) {
      button.textContent = "✅ Notifiche attive";
      button.classList.add("active");
      button.disabled = false;

      if (description) {
        description.textContent =
          "Riceverai gli avvisi della squadra.";
      }

      banner.classList.remove("hidden");
      return;
    }

    /*
     * Il browser ha bloccato definitivamente le notifiche.
     * JavaScript non può riaprire il popup: serve reimpostare
     * il permesso dalle impostazioni del sito.
     */
    if (browserPermission === "denied") {
      button.textContent = "⚙️ Notifiche bloccate";
      button.classList.remove("active");
      button.disabled = true;

      if (description) {
        description.textContent =
          "Apri le impostazioni del browser per consentire le notifiche.";
      }

      banner.classList.remove("hidden");
      return;
    }

    /*
     * "default" significa che l'utente non ha ancora deciso.
     * Il pulsante deve restare attivo.
     */
    button.textContent = "🔔 Attiva notifiche";
    button.classList.remove("active");
    button.disabled = false;

    if (description) {
      description.textContent =
        "Ricevi subito gli avvisi della squadra.";
    }

    banner.classList.remove("hidden");
  }

  async function toggleNotify() {
    const button = document.getElementById("notify-btn");

    if (!button) {
      return;
    }

    if (!oneSignalReady || !oneSignalInstance) {
      button.textContent = "⏳ Caricamento…";
      return;
    }

    const browserPermission = Notification.permission;

    if (browserPermission === "denied") {
      refreshNotifyUI();
      return;
    }

    button.disabled = true;
    button.textContent = "⏳ Attivazione…";

    try {
      if (
        oneSignalInstance.User.PushSubscription.optedIn
      ) {
        await oneSignalInstance.User.PushSubscription.optOut();

        console.log("[OneSignal] opt-out eseguito");

        button.disabled = false;
        refreshNotifyUI();
        return;
      }

      if (browserPermission === "default") {
        await oneSignalInstance.Notifications.requestPermission();
      }

      if (Notification.permission !== "granted") {
        console.warn(
          "[OneSignal] permesso non concesso:",
          Notification.permission
        );

        refreshNotifyUI();
        return;
      }

      await oneSignalInstance.User.PushSubscription.optIn();

      console.log("[OneSignal] opt-in eseguito");

      /*
       * Attende la creazione dell'ID subscription prima
       * di aggiornare l'etichetta.
       */
      for (let attempt = 0; attempt < 10; attempt += 1) {
        await new Promise(resolve => {
          setTimeout(resolve, 500);
        });

        const subscriptionId =
          oneSignalInstance.User.PushSubscription.id;

        if (subscriptionId) {
          break;
        }
      }

      refreshNotifyUI();
    } catch (error) {
      console.error(
        "[OneSignal] errore attivazione notifiche:",
        error
      );

      button.disabled = false;
      button.textContent = "🔔 Attiva notifiche";
    }
  }
</script>
